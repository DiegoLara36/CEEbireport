{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102b3f">
    <title>{% block title %}CEE BI · Educación continua{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'catalog/report.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'dashboard' %}" aria-label="CEE BI, inicio">
            <span class="brand-mark">CEE</span>
            <span class="brand-copy"><strong>CEE BI</strong><small>Educación continua</small></span>
        </a>
        <nav class="main-nav" aria-label="Navegación principal">
            <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}is-active{% endif %}">Reporte BI</a>
            <a href="{% url 'etl_flow' %}" class="{% if request.resolver_match.url_name == 'etl_flow' %}is-active{% endif %}">Flujo ETL</a>
        </nav>
        <span class="header-source"><span class="status-dot"></span> Fuente activa · PUCP</span>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <span>CEE BI <span class="footer-separator">/</span> Inteligencia de cursos</span>
        <span>Catálogo de Educación Continua PUCP</span>
    </footer>
</body>
</html>
